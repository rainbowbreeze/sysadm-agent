---
machine_hostname: "camera06"
baseline_timezone: "Europe/Rome"
baseline_ssh_pub_key_file: "{{ playbook_dir }}/../../ssh_keys/sysadm-agent.pub"
baseline_enable_node_exporter: true

stream_ustreamer_enabled: true
stream_ustreamer_video_device: "/dev/video0"
stream_ustreamer_format: "MJPEG"
stream_ustreamer_width: 1280
stream_ustreamer_height: 720
stream_ustreamer_fps: 30
stream_ustreamer_slowdown: false
stream_ustreamer_extra_args: "--persistent --buffers=4"

firewall_nftables_enabled: true
firewall_nftables_allow_mdns: false
firewall_nftables_allowed_tcp_ports:
  - "{{ machine_ssh_port }}"
  - "{{ stream_ustreamer_port }}"
  - "{{ node_exporter_port }}"

---
machine_hostname: "imx7d-camera06"
baseline_timezone: "Europe/Rome"
baseline_ssh_pub_key_file: "{{ playbook_dir }}/../../ssh_keys/sysadm-agent.pub"
baseline_disable_gui: true
baseline_enable_node_exporter: true

baseline_apt_gpg_keys:
  - name: vivaldi
    url: "https://repo.vivaldi.com/stable/linux_signing_key.pub"

wifi_bcm4339_enable_bluetooth_service: false

camera_huddly_go_video_device: "/dev/video1"

stream_ustreamer_enabled: true
stream_ustreamer_video_device: "/dev/video1"
stream_ustreamer_format: "MJPEG"
stream_ustreamer_width: 1280
stream_ustreamer_height: 720
stream_ustreamer_fps: 15
stream_ustreamer_slowdown: true
stream_ustreamer_extra_args: "--persistent --buffers=4 --tcp-nodelay --server-timeout=30 --drop-same-frames=15"

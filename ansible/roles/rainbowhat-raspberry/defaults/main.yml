---
# Module: rainbowhat-raspberry
# Description: Configures I2C/SPI kernel modules and installs Pimoroni Rainbow HAT Python libraries in an isolated virtualenv for Raspberry Pi hardware.
# Supported OS Families: Debian
# Required Secrets (in machines/<MACHINE_NAME>/secrets.yml): None

rainbowhat_enable_i2c: true
rainbowhat_enable_spi: true
rainbowhat_python_venv: "/opt/rainbowhat/venv"
rainbowhat_packages:
  - i2c-tools
  - python3
  - python3-venv
  - python3-pip
  - python3-dev
  - python3-smbus
  - build-essential

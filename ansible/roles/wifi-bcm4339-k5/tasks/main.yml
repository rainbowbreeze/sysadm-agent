---
- name: Verify target OS and kernel version are supported by wifi-bcm4339-k5
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "Debian"
      - ansible_facts["kernel"] == wifi_bcm4339_k5_kernel_version
    fail_msg: >-
      Module wifi-bcm4339-k5 requires Debian/Ubuntu with kernel
      {{ wifi_bcm4339_k5_kernel_version }}
      (found OS family={{ ansible_facts['os_family'] }}, kernel={{ ansible_facts['kernel'] }}).
      For Linux Kernel 6.x boards, use wifi-bcm4339-k6 instead.

- name: Ensure Broadcom kernel module, firmware, and local sbin directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "/lib/modules/{{ wifi_bcm4339_k5_kernel_version }}/kernel/drivers/net/wireless/broadcom/brcm80211/brcmfmac"
    - "/lib/modules/{{ wifi_bcm4339_k5_kernel_version }}/kernel/drivers/net/wireless/broadcom/brcm80211/brcmutil"
    - /lib/firmware/brcm
    - /usr/local/sbin

- name: Install prebuilt brcmfmac.ko kernel module (kernel {{ wifi_bcm4339_k5_kernel_version }})
  ansible.builtin.copy:
    src: brcmfmac.ko
    dest: "/lib/modules/{{ wifi_bcm4339_k5_kernel_version }}/kernel/drivers/net/wireless/broadcom/brcm80211/brcmfmac/brcmfmac.ko"
    owner: root
    group: root
    mode: "0644"
  notify: Run depmod for wifi-bcm4339-k5

- name: Install prebuilt brcmutil.ko kernel module (kernel {{ wifi_bcm4339_k5_kernel_version }})
  ansible.builtin.copy:
    src: brcmutil.ko
    dest: "/lib/modules/{{ wifi_bcm4339_k5_kernel_version }}/kernel/drivers/net/wireless/broadcom/brcm80211/brcmutil/brcmutil.ko"
    owner: root
    group: root
    mode: "0644"
  notify: Run depmod for wifi-bcm4339-k5

- name: Install BCM4339 SDIO WiFi firmware binary (brcmfmac4339-sdio.bin)
  ansible.builtin.copy:
    src: cyfmac4339-sdio.bin
    dest: /lib/firmware/brcm/brcmfmac4339-sdio.bin
    owner: root
    group: root
    mode: "0644"

- name: Install BCM4339 SDIO WiFi NVRAM calibration file (brcmfmac4339-sdio.txt)
  ansible.builtin.copy:
    src: brcmfmac4339-sdio.txt
    dest: /lib/firmware/brcm/brcmfmac4339-sdio.txt
    owner: root
    group: root
    mode: "0644"

- name: Install i.MX7D CCM_CLKO2 32.768 kHz clock helper script
  ansible.builtin.copy:
    src: brcm-clko2-enable.py
    dest: /usr/local/sbin/brcm-clko2-enable.py
    owner: root
    group: root
    mode: "0755"

- name: Configure brcmfmac modprobe hook, options, and bcmdhd blacklist
  ansible.builtin.template:
    src: brcmfmac.conf.j2
    dest: /etc/modprobe.d/brcmfmac.conf
    owner: root
    group: root
    mode: "0644"

- name: Install BCM4339 Bluetooth UART patchram firmware (BCM4335C0.hcd)
  ansible.builtin.copy:
    src: BCM4335C0.hcd
    dest: /lib/firmware/brcm/BCM4335C0.hcd
    owner: root
    group: root
    mode: "0644"
  when: wifi_bcm4339_k5_enable_bluetooth_service | bool

- name: Install BCM4339 Bluetooth hardware reset helper script
  ansible.builtin.copy:
    src: brcm-bt-reset.sh
    dest: /usr/local/sbin/brcm-bt-reset.sh
    owner: root
    group: root
    mode: "0755"
  register: wifi_bcm4339_k5_bt_reset_script

- name: Install brcm-bluetooth.service systemd unit
  ansible.builtin.copy:
    src: brcm-bluetooth.service
    dest: /etc/systemd/system/brcm-bluetooth.service
    owner: root
    group: root
    mode: "0644"
  register: wifi_bcm4339_k5_bt_unit
  notify: Reload systemd for wifi-bcm4339-k5

- name: Flush handlers before module verification
  ansible.builtin.meta: flush_handlers

- name: Ensure brcmfmac kernel module is loaded
  ansible.builtin.command:
    cmd: modprobe brcmfmac
  changed_when: false
  when: not ansible_check_mode

- name: Wait for wlan0 wireless network interface to register
  ansible.builtin.stat:
    path: /sys/class/net/wlan0
  register: wifi_bcm4339_k5_wlan0_stat
  until: wifi_bcm4339_k5_wlan0_stat.stat.exists
  retries: 15
  delay: 1
  failed_when: not wifi_bcm4339_k5_wlan0_stat.stat.exists
  when: not ansible_check_mode

- name: Ensure brcm-bluetooth.service is enabled and started
  ansible.builtin.systemd:
    name: brcm-bluetooth.service
    daemon_reload: true
    state: >-
      {{
        ('restarted' if (wifi_bcm4339_k5_bt_reset_script.changed or wifi_bcm4339_k5_bt_unit.changed) else 'started')
        if (wifi_bcm4339_k5_enable_bluetooth_service | bool)
        else 'stopped'
      }}
    enabled: "{{ wifi_bcm4339_k5_enable_bluetooth_service | bool }}"
  when: not ansible_check_mode

- name: Wait for hci0 Bluetooth interface to register
  ansible.builtin.stat:
    path: /sys/class/bluetooth/hci0
  register: wifi_bcm4339_k5_hci0_stat
  until: wifi_bcm4339_k5_hci0_stat.stat.exists
  retries: 10
  delay: 1
  failed_when: not wifi_bcm4339_k5_hci0_stat.stat.exists
  when:
    - wifi_bcm4339_k5_enable_bluetooth_service | bool
    - not ansible_check_mode

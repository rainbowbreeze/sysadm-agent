---
# Module: camerabooth
# Description: Deploys the Python 3 + GTK 3 touchscreen Camera Booth GUI app (/usr/local/bin/camera-booth), ~/camera_booth folder, and Weston launcher icon.
# Supported OS Families: Debian, TechNexion i.MX Release Distro
# Required Secrets (in machines/<MACHINE_NAME>/secrets.yml): None
# Key Configurable Parameters (override in machines/<MACHINE_NAME>/vars.yml):
#   - camerabooth_rotation: Optional image rotation override in degrees (0, 90, 180, or 270; default "" inherits /usr/local/bin/camera's configured rotation)
#   - camerabooth_countdown_seconds: Visual countdown seconds before snapping photo (default: 3; set 0 for immediate capture)
#   - camerabooth_preview_enabled: Stream live low-FPS camera preview in the booth window (default: true)
#   - camerabooth_preview_fps: Live preview frame rate in FPS (default: 5)
#   - camerabooth_review_seconds: Seconds to show captured photo (with Discard & Retake option) before resuming live stream (default: 6)
#   - camerabooth_idle_timeout: Seconds of inactivity before putting camera stream to sleep (default: 60; set 0 to disable)
#   - camerabooth_tap_anywhere: Allow tapping anywhere on the video canvas to wake, trigger/cancel countdown, or keep photo (default: true)
#   - camerabooth_allow_discard: Show "Discard & Retake" button during post-shot review (default: true)

camerabooth_script_path: "/usr/local/bin/camera-booth"
camerabooth_user_home: "{{ '/root' if ansible_user == 'root' else '/home/' ~ ansible_user }}"
camerabooth_user_symlink: "{{ camerabooth_user_home }}/camera_booth.py"
camerabooth_output_dir: "{{ camerabooth_user_home }}/camera_booth"
camerabooth_camera_cli: "/usr/local/bin/camera"
camerabooth_rotation: ""
camerabooth_countdown_seconds: 3
camerabooth_preview_enabled: true
camerabooth_preview_fps: 5
camerabooth_review_seconds: 6
camerabooth_idle_timeout: 60
camerabooth_tap_anywhere: true
camerabooth_allow_discard: true
camerabooth_window_title: "Camera Booth"
camerabooth_window_width: 740
camerabooth_window_height: 410
camerabooth_preview_width: 560
camerabooth_preview_height: 305
camerabooth_button_height: 50
camerabooth_xdg_runtime_dir: "/run/user/0"
camerabooth_wayland_display: "wayland-0"
camerabooth_gdk_backend: "wayland"
camerabooth_icon_path: "/usr/share/weston/icon_camera.png"
camerabooth_weston_ini_path: "/etc/xdg/weston/weston.ini"
camerabooth_configure_weston_launcher: true
camerabooth_ensure_default_weston_launchers: true
camerabooth_packages:
  - gir1.2-gdkpixbuf-2.0
  - gir1.2-gstreamer-1.0
  - gir1.2-gtk-3.0
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - python3-cairo
  - python3-gi
  - python3-gi-cairo

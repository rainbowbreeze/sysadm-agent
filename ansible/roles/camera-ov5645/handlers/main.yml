---
- name: Reload udev rules for camera-ov5645
  ansible.builtin.shell: |
    udevadm control --reload-rules || true
    udevadm trigger || true
  changed_when: true

- name: Restart camera-init service
  ansible.builtin.systemd:
    name: camera-init.service
    daemon_reload: true
    state: restarted
    enabled: true

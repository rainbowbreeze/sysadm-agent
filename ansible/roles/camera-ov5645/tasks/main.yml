---
- name: Verify target OS is supported by camera-ov5645
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] in ["Debian", "TechNexion i.MX Release Distro"]
    fail_msg: >-
      Module camera-ov5645 only supports Debian/Ubuntu and TechNexion i.MX Release Distro
      (found {{ ansible_facts['os_family'] }}).

- name: Verify configured camera_ov5645_rotation angle is valid
  ansible.builtin.assert:
    that:
      - (camera_ov5645_rotation | int) in [0, 90, 180, 270]
    fail_msg: >-
      camera_ov5645_rotation must be one of 0, 90, 180, or 270
      (found {{ camera_ov5645_rotation }}).

- name: Install V4L2, GStreamer, I2C, and Python dependencies for OV5645 MIPI-CSI camera
  ansible.builtin.package:
    name: "{{ camera_ov5645_packages }}"
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Ensure camera user belongs to video group (Debian)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - video
    append: true
  when: ansible_facts["os_family"] == "Debian"

- name: Ensure camera user belongs to video group (TechNexion Yocto)
  ansible.builtin.shell:
    cmd: |
      if id -nG {{ ansible_user | quote }} | tr ' ' '\n' | grep -qx "video"; then
        echo "UNCHANGED"
      else
        usermod -aG video {{ ansible_user | quote }}
        echo "ADDED"
      fi
  when: ansible_facts["os_family"] == "TechNexion i.MX Release Distro"
  register: camera_ov5645_usermod
  changed_when: "'ADDED' in camera_ov5645_usermod.stdout"

- name: Ensure camera installation and local binary directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ camera_ov5645_install_dir }}"
      owner: "{{ ansible_user }}"
      group: "{{ camera_ov5645_group }}"
      mode: "0775"
    - path: "{{ camera_ov5645_cli_path | dirname }}"
      owner: root
      group: root
      mode: "0755"
    - path: /usr/local/sbin
      owner: root
      group: root
      mode: "0755"

- name: Create isolated Python virtualenv for camera controller
  ansible.builtin.command:
    cmd: "python3 -m venv {{ camera_ov5645_python_venv }}"
    creates: "{{ camera_ov5645_python_venv }}/bin/activate"
  when: ansible_facts["os_family"] == "Debian"

- name: Deploy OV5645 MIPI-CSI camera Python controller and CLI
  ansible.builtin.copy:
    src: camera.py
    dest: "{{ camera_ov5645_install_dir }}/camera.py"
    owner: "{{ ansible_user }}"
    group: "{{ camera_ov5645_group }}"
    mode: "0755"

- name: Deploy camera requirements.txt
  ansible.builtin.copy:
    src: requirements.txt
    dest: "{{ camera_ov5645_install_dir }}/requirements.txt"
    owner: "{{ ansible_user }}"
    group: "{{ camera_ov5645_group }}"
    mode: "0644"

- name: Deploy camera CLI wrapper script
  ansible.builtin.template:
    src: camera.sh.j2
    dest: "{{ camera_ov5645_install_dir }}/camera.sh"
    owner: "{{ ansible_user }}"
    group: "{{ camera_ov5645_group }}"
    mode: "0755"

- name: Symlink camera CLI into /usr/local/bin/camera
  ansible.builtin.file:
    src: "{{ camera_ov5645_install_dir }}/camera.sh"
    dest: "{{ camera_ov5645_cli_path }}"
    state: link
    force: true

- name: Configure udev rules for MIPI-CSI camera V4L2, media, and I2C devices
  ansible.builtin.template:
    src: 99-camera.rules.j2
    dest: /etc/udev/rules.d/99-camera.rules
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload udev rules for camera-ov5645
    - Restart camera-init service

- name: Install MIPI-CSI camera hardware initialization script
  ansible.builtin.template:
    src: camera-init.sh.j2
    dest: /usr/local/sbin/camera-init.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart camera-init service

- name: Install camera-init systemd service
  ansible.builtin.copy:
    src: camera-init.service
    dest: /etc/systemd/system/camera-init.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart camera-init service

- name: Install boot DTB camera node updater script
  ansible.builtin.template:
    src: update-camera-dtb.py.j2
    dest: /usr/local/sbin/camera-ov5645-update-dtb.py
    owner: root
    group: root
    mode: "0755"

- name: Check if active device-tree already includes ov5645_mipi@3c on i2c-3
  ansible.builtin.stat:
    path: /proc/device-tree/soc/bus@30800000/i2c@30a50000/ov5645_mipi@3c
  register: camera_ov5645_dt_node_stat

- name: Ensure ov5645_mipi@3c node is configured in imx7d-pico-pi.dtb on boot partition ({{ camera_ov5645_boot_partition }})
  ansible.builtin.command:
    cmd: /usr/local/sbin/camera-ov5645-update-dtb.py
  when:
    - camera_ov5645_patch_boot_dtb | bool
  register: camera_ov5645_dtb_updated
  changed_when: "'UPDATED' in camera_ov5645_dtb_updated.stdout"

- name: Ensure camera-init systemd service is enabled and started
  ansible.builtin.systemd:
    name: camera-init.service
    daemon_reload: true
    state: started
    enabled: true

- name: Flush handlers before optional camera DTB reboot
  ansible.builtin.meta: flush_handlers

- name: Reboot board to activate ov5645_mipi@3c camera device-tree node
  when:
    - camera_ov5645_patch_boot_dtb | bool
    - camera_ov5645_reboot_on_dtb_change | bool
    - (camera_ov5645_dtb_updated is defined and camera_ov5645_dtb_updated.changed) or not camera_ov5645_dt_node_stat.stat.exists
    - not ansible_check_mode
  block:
    - name: Attempt warm reboot to activate ov5645_mipi@3c camera device-tree node
      ansible.builtin.reboot:
        msg: "Rebooting to activate ov5645_mipi@3c node in imx7d-pico-pi.dtb"
        reboot_timeout: "{{ camera_ov5645_reboot_timeout }}"
  rescue:
    - name: Notify operator to manually power-cycle board within {{ camera_ov5645_reboot_rescue_timeout }}s
      ansible.builtin.debug:
        msg: >-
          [ACTION REQUIRED] Warm reboot timed out after {{ camera_ov5645_reboot_timeout }}s on {{ inventory_hostname }}.
          Please power-cycle or manually reboot the board now. Waiting up to
          {{ camera_ov5645_reboot_rescue_timeout }}s for SSH reconnection to resume playbook...

    - name: Reset SSH connection before waiting for manual board reboot
      ansible.builtin.meta: reset_connection

    - name: Wait up to {{ camera_ov5645_reboot_rescue_timeout }}s for board SSH reconnection after manual reboot
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 5
        timeout: "{{ camera_ov5645_reboot_rescue_timeout }}"

- name: Ensure camera-init systemd service is active after boot
  ansible.builtin.systemd:
    name: camera-init.service
    state: started
    enabled: true

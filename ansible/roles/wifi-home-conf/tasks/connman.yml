---
- name: Ensure local sbin and ConnMan state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/sbin
    - /var/lib/connman

- name: Configure persistent WiFi regulatory domain udev rule
  when: wifi_home_conf_regdom | default('', true) | trim | length > 0
  block:
    - name: Deploy /etc/udev/rules.d/85-regulatory.rules
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/85-regulatory.rules
        content: |
          # Managed by Ansible (wifi-home-conf role)
          SUBSYSTEM=="net", ACTION=="add", KERNEL=="wlan*", RUN+="/usr/sbin/iw reg set {{ wifi_home_conf_regdom | trim }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload udev rules for wifi-home-conf

    - name: Flush udev handler before checking regulatory domain
      ansible.builtin.meta: flush_handlers

    - name: Check active kernel WiFi regulatory domain
      ansible.builtin.command:
        cmd: /usr/sbin/iw reg get
      register: wifi_home_conf_regdom_current
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Apply WiFi regulatory domain immediately
      ansible.builtin.command:
        argv:
          - /usr/sbin/iw
          - reg
          - set
          - "{{ wifi_home_conf_regdom | trim }}"
      changed_when: true
      when:
        - not ansible_check_mode
        - ("country " ~ (wifi_home_conf_regdom | trim) ~ ":") not in (wifi_home_conf_regdom_current.stdout | default(''))

- name: Ensure ConnMan service is enabled and running
  ansible.builtin.systemd:
    name: connman.service
    state: started
    enabled: true

- name: Deploy ConnMan persistent WiFi provisioning profile (/var/lib/connman/wifi.config)
  ansible.builtin.template:
    src: connman-wifi.config.j2
    dest: /var/lib/connman/wifi.config
    owner: root
    group: root
    mode: "0600"
  register: wifi_home_conf_connman_profile
  no_log: true

- name: Install ConnMan WiFi profile activation helper script
  ansible.builtin.copy:
    src: connman-wifi-connect.py
    dest: /usr/local/sbin/connman-wifi-connect.py
    owner: root
    group: root
    mode: "0755"

- name: Activate provisioned ConnMan WiFi profile on {{ wifi_home_conf_interface }}
  ansible.builtin.command:
    argv: >-
      {{
        [
          '/usr/local/sbin/connman-wifi-connect.py',
          '--config', '/var/lib/connman/wifi.config',
          '--interface', wifi_home_conf_interface
        ] + (['--force-reconnect'] if wifi_home_conf_connman_profile.changed else [])
      }}
  register: wifi_home_conf_connman_activate
  changed_when: "'CONNECTED' in wifi_home_conf_connman_activate.stdout"
  when:
    - wifi_home_conf_activate | bool
    - not ansible_check_mode

- name: Configure ConnMan WiFi source-based policy routing
  when: wifi_home_conf_source_routing | bool
  block:
    - name: Deploy WiFi source policy routing helper script
      ansible.builtin.template:
        src: 99-wifi-source-routing.j2
        dest: /usr/local/sbin/wifi-source-routing
        owner: root
        group: root
        mode: "0755"
      register: wifi_home_conf_connman_route_script

    - name: Install WiFi source policy routing netlink watcher
      ansible.builtin.copy:
        src: wifi-source-routing-watch.py
        dest: /usr/local/sbin/wifi-source-routing-watch.py
        owner: root
        group: root
        mode: "0755"
      register: wifi_home_conf_connman_watch_script

    - name: Deploy wifi-source-routing.service systemd unit
      ansible.builtin.template:
        src: wifi-source-routing.service.j2
        dest: /etc/systemd/system/wifi-source-routing.service
        owner: root
        group: root
        mode: "0644"
      register: wifi_home_conf_connman_watch_unit

    - name: Ensure wifi-source-routing.service is enabled and running
      ansible.builtin.systemd:
        name: wifi-source-routing.service
        daemon_reload: true
        state: >-
          {{
            'restarted'
            if (
              wifi_home_conf_connman_route_script.changed or
              wifi_home_conf_connman_watch_script.changed or
              wifi_home_conf_connman_watch_unit.changed
            )
            else 'started'
          }}
        enabled: true
      when: not ansible_check_mode

    - name: Check if WiFi source policy routing rule is already active
      ansible.builtin.command:
        cmd: ip -4 rule show
      register: wifi_home_conf_connman_rule_check
      changed_when: false
      when: not ansible_check_mode

    - name: Apply WiFi source policy routing rule immediately on {{ wifi_home_conf_interface }}
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/wifi-source-routing
          - "{{ wifi_home_conf_interface }}"
          - up
      when:
        - not ansible_check_mode
        - >-
          wifi_home_conf_connman_route_script.changed or
          (("lookup " ~ (wifi_home_conf_route_table | string)) not in wifi_home_conf_connman_rule_check.stdout)
      changed_when: true

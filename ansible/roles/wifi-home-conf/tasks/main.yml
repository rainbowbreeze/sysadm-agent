---
- name: Verify target OS and WiFi profile variables are valid for wifi-home-conf
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] in ["Debian", "Alpine", "TechNexion i.MX Release Distro"]
      - (wifi_profile1_ssid | length > 0) or (wifi_profile2_ssid | length > 0)
      - (wifi_profile1_ssid | length == 0) or (wifi_profile1_password | length > 0)
      - (wifi_profile2_ssid | length == 0) or (wifi_profile2_password | length > 0)
    fail_msg: >-
      Module wifi-home-conf requires Debian/Ubuntu, Alpine, or TechNexion i.MX Release Distro
      and at least one configured WiFi profile (wifi_profile1_ssid + wifi_profile1_password
      and/or wifi_profile2_ssid + wifi_profile2_password in secrets.yml).

- name: Configure WiFi profiles via NetworkManager (Debian / Ubuntu / Alpine)
  ansible.builtin.include_tasks: networkmanager.yml
  when: ansible_facts["os_family"] in ["Debian", "Alpine"]

- name: Configure WiFi profiles via ConnMan (TechNexion Yocto)
  ansible.builtin.include_tasks: connman.yml
  when: ansible_facts["os_family"] == "TechNexion i.MX Release Distro"

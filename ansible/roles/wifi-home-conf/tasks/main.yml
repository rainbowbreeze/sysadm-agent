---
- name: Verify target OS and WiFi profile variables are valid for wifi-home-conf
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] in ["Debian", "Alpine"]
      - (wifi_profile1_ssid | length > 0) or (wifi_profile2_ssid | length > 0)
      - (wifi_profile1_ssid | length == 0) or (wifi_profile1_password | length > 0)
      - (wifi_profile2_ssid | length == 0) or (wifi_profile2_password | length > 0)
    fail_msg: >-
      Module wifi-home-conf requires Debian/Ubuntu or Alpine and at least one configured
      WiFi profile (wifi_profile1_ssid + wifi_profile1_password and/or
      wifi_profile2_ssid + wifi_profile2_password in secrets.yml).

- name: Load OS-specific NetworkManager variables for wifi-home-conf
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Ensure NetworkManager packages are installed
  ansible.builtin.package:
    name: "{{ wifi_home_conf_packages }}"
    state: present

- name: Ensure NetworkManager service is enabled and running
  ansible.builtin.service:
    name: "{{ wifi_home_conf_service_name }}"
    state: started
    enabled: true

- name: Ensure NetworkManager system-connections directory exists
  ansible.builtin.file:
    path: /etc/NetworkManager/system-connections
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy NetworkManager WiFi connection profiles (<ssid>-profile)
  ansible.builtin.template:
    src: wifi-profile.nmconnection.j2
    dest: "/etc/NetworkManager/system-connections/{{ item.ssid }}-profile.nmconnection"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: profile1
      ssid: "{{ wifi_profile1_ssid }}"
      password: "{{ wifi_profile1_password }}"
      priority: "{{ wifi_home_conf_profile1_priority }}"
    - name: profile2
      ssid: "{{ wifi_profile2_ssid }}"
      password: "{{ wifi_profile2_password }}"
      priority: "{{ wifi_home_conf_profile2_priority }}"
  loop_control:
    label: "{{ item.name }} ({{ item.ssid ~ '-profile' if item.ssid | length > 0 else 'skipped' }})"
  when: item.ssid | length > 0
  register: wifi_home_conf_profiles_rendered
  no_log: true

- name: Reload NetworkManager connection profiles when updated
  ansible.builtin.command:
    cmd: nmcli connection reload
  when: wifi_home_conf_profiles_rendered is changed
  changed_when: true

- name: Check currently active NetworkManager connection on {{ wifi_home_conf_interface }}
  ansible.builtin.command:
    cmd: "nmcli -g GENERAL.CONNECTION device show {{ wifi_home_conf_interface | quote }}"
  register: wifi_home_conf_active_conn
  changed_when: false
  failed_when: false
  when: wifi_home_conf_activate | bool

- name: Activate primary WiFi profile ({{ wifi_profile1_ssid }}-profile)
  ansible.builtin.command:
    cmd: "nmcli connection up {{ (wifi_profile1_ssid ~ '-profile') | quote }}"
  when:
    - wifi_home_conf_activate | bool
    - wifi_profile1_ssid | length > 0
  register: wifi_home_conf_up_profile1
  failed_when:
    - wifi_home_conf_up_profile1.rc != 0
    - wifi_profile2_ssid | length == 0
  changed_when: >-
    (wifi_home_conf_up_profile1.rc == 0) and
    ((wifi_home_conf_active_conn.stdout | default('') | trim) != (wifi_profile1_ssid ~ '-profile') or
     (wifi_home_conf_profiles_rendered is changed))

- name: Activate fallback WiFi profile ({{ wifi_profile2_ssid }}-profile)
  ansible.builtin.command:
    cmd: "nmcli connection up {{ (wifi_profile2_ssid ~ '-profile') | quote }}"
  when:
    - wifi_home_conf_activate | bool
    - wifi_profile2_ssid | length > 0
    - (wifi_profile1_ssid | length == 0) or (wifi_home_conf_up_profile1.rc | default(1) != 0)
  register: wifi_home_conf_up_profile2
  changed_when: >-
    (wifi_home_conf_up_profile2.rc == 0) and
    ((wifi_home_conf_active_conn.stdout | default('') | trim) != (wifi_profile2_ssid ~ '-profile') or
     (wifi_home_conf_profiles_rendered is changed))

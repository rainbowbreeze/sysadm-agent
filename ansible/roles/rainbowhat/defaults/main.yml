---
# Module: rainbowhat
# Description: Configures I2C/SPI kernel modules and installs Pimoroni Rainbow HAT Python libraries in an isolated virtualenv.
# Supported OS Families: Debian
# Required Machine Env Vars (in machines/<MACHINE_NAME>/vars.yml): None

rainbowhat_enable_i2c: true
rainbowhat_enable_spi: true
rainbowhat_python_venv: "/opt/rainbowhat/venv"
rainbowhat_packages:
  - i2c-tools
  - python3
  - python3-venv
  - python3-pip

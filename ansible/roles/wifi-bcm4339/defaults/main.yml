---
# Module: wifi-bcm4339
# Description: Configures Broadcom BCM4339 (AP6335) SDIO WiFi & UART BT on PICO-PI-IMX7D (5.x via CCM_CLKO2 hook; 6.x via in-place DTB/uEnv update).
# Supported OS Families: Debian, TechNexion i.MX Release Distro
# Required Secrets (in machines/<MACHINE_NAME>/secrets.yml): None

wifi_bcm4339_kernel_version: "5.15.71"
wifi_bcm4339_dtb_6x: "imx7d-pico-pi-brcm-6.18.dtb"
wifi_bcm4339_boot_partition: "/dev/mmcblk2p1"
wifi_bcm4339_boot_mount_point: "/mnt"
wifi_bcm4339_uenv_wifi_module: "brcm"
wifi_bcm4339_feature_disable: "0x82000"
wifi_bcm4339_blacklist_bcmdhd: true
wifi_bcm4339_enable_bluetooth_service: true
wifi_bcm4339_reboot_on_boot_change: true
wifi_bcm4339_reboot_timeout: 120
wifi_bcm4339_reboot_rescue_timeout: 180
